<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Notifications</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="title-div">
        <h1>Library Notifications</h1>
    </div>

    <div id="library-api-div">
        <button id="press-btn">Get Library Data</button>
        <p id="update-time-p">Updates Every Loading Minutes</p>
    </div>

    <div id="send-telegram-msg-div">
        <button id="send-message-btn">Send Message</button>
        <input type="text" id="message-input">
    </div>

    <div id="library-data-div">
        <p class="lib-info-txt" id="total-spaces">Total</p>
        <p class="lib-info-txt" id="free-spaces">Free</p>
        <p class="lib-info-txt" id="free-spaces-percent">Free%</p>
    </div>

    <div class="title-div" style="display: none;">
        <h3>Frequency (minutes)</h3>
    </div>
    <div id="update-frequency-div" style="display: none;">
        <button class="change-value-button" id="increase-frequency-btn">-</button>
        <p id="frequency-value">30</p>
        <button class="change-value-button" id="decrease-frequency-btn">+</button>
    </div>
    <div class="title-div" style="display: none;">
        <button id=apply-frequency-btn>Apply</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
